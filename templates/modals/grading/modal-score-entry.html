       MODAL: GENERIC SCORE ENTRY FOR SUPERVISOR / PRELIMINARY / REVIEWER (v1.9.0-beta.1)
       ============================================================================ -->
  <div id="modal-score-entry" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-200 text-xs">
      <div class="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
        <div>
          <h4 id="score-entry-modal-title" class="font-black text-sm text-slate-900">Nhập Điểm Đánh giá</h4>
          <p id="score-entry-student-name" class="text-xs text-slate-500 mt-0.5">Sinh viên: ...</p>
        </div>
        <button type="button" onclick="closeScoreEntryModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
      </div>

      <div class="p-5 space-y-4">
        <input type="hidden" id="score-entry-type">
        <input type="hidden" id="score-entry-student-id">

        <div id="score-entry-warning-box" class="hidden p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900">
          <!-- Warning e.g. already finalized by another supervisor -->
        </div>

        <div>
          <label class="font-bold text-slate-700 block mb-1">Điểm đánh giá (0 – 10, bước điểm 0.1) <span class="text-rose-500">*</span></label>
          <div class="flex items-center gap-3">
            <input type="number" id="score-entry-value" min="0" max="10" step="0.1" placeholder="8.5" class="w-36 p-2 border border-slate-300 rounded-xl font-mono text-sm font-black text-slate-900">
            <span class="text-slate-500 font-semibold">/ 10 điểm</span>
          </div>
        </div>

        <div>
          <label class="font-bold text-slate-700 block mb-1">Nhận xét chuyên môn (không bắt buộc):</label>
          <textarea id="score-entry-comment" rows="3" placeholder="Góp ý chuyên môn, ưu khuyết điểm..." class="w-full p-2.5 border border-slate-300 rounded-xl"></textarea>
        </div>
      </div>

      <div class="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
        <span id="score-entry-saved-time" class="text-[11px] text-slate-400 font-mono"></span>
        <div class="flex items-center gap-2">
          <button type="button" onclick="closeScoreEntryModal()" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-600 font-bold">Hủy</button>
          <button type="button" id="btn-score-entry-draft" onclick="saveScoreEntry(false)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-bold rounded-lg">💾 Lưu tạm</button>
          <button type="button" id="btn-score-entry-complete" onclick="saveScoreEntry(true)" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-xs">✓ Hoàn tất</button>
        </div>
      </div>
    </div>
  </div>
