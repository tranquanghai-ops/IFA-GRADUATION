
  <!-- MODAL: ADD SUPPORT SUPERVISOR -->
  <div id="modal-add-support-supervisor" class="hidden fixed inset-0 z-[80] modal-backdrop flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[90vh] overflow-hidden border border-slate-200">
      <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-100 shrink-0">
        <div>
          <h3 class="font-bold text-base text-tdtu-blue">Thêm GVHD 2</h3>
          <p id="add-support-student-info" class="text-xs text-slate-500 mt-0.5">Sinh viên: ...</p>
        </div>
        <button type="button" onclick="closeAddSupportSupervisorModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1 text-base">✕</button>
      </div>

      <div class="p-5 space-y-4 text-xs overflow-y-auto flex-1">
        <input type="hidden" id="support-target-student-id">

        <!-- Info card: Current Primary Supervisor -->
        <div class="p-3 bg-blue-50/70 border border-blue-200 rounded-xl space-y-1">
          <span class="text-[10px] font-bold uppercase tracking-wider text-blue-800">Giảng viên hướng dẫn hiện tại:</span>
          <div id="support-current-supervisors-summary" class="font-bold text-slate-800 text-xs mt-1">...</div>
        </div>

        <!-- Select Support Supervisor -->
        <div>
          <label class="font-bold text-slate-700 block mb-1">Chọn Giảng viên hướng dẫn 2 (GVHD 2) <span class="text-rose-500">*</span></label>
          <select id="select-support-supervisor" onchange="onSelectSupportSupervisorChange(this.value)" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
            <option value="">-- Chọn GVHD 2 --</option>
          </select>
          <p id="support-supervisor-quota-hint" class="text-[11px] text-slate-500 mt-1 font-mono"></p>
        </div>

        <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl space-y-1 text-amber-900 leading-relaxed text-[11px]">
          <p>💡 <strong>Quy định nghiệp vụ:</strong></p>
          <ul class="list-disc list-inside space-y-0.5">
            <li>GVHD 2 không cần nằm trong các nguyện vọng ban đầu của SV.</li>
            <li>Không thay đổi GVHD chính và không sửa lịch sử xét duyệt.</li>
            <li>Sinh viên được thêm sẽ tính vào hạn mức Quota của GVHD 2.</li>
          </ul>
        </div>
      </div>

      <div class="flex justify-end gap-2 p-4 bg-slate-50 border-t border-slate-100 shrink-0">
        <button type="button" onclick="closeAddSupportSupervisorModal()" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-100 transition-colors">Hủy</button>
        <button type="button" id="btn-confirm-add-support" onclick="executeAddSupportSupervisor()" disabled class="px-5 py-2 bg-tdtu-blue hover:bg-tdtu-dark disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl font-bold shadow-md transition-colors">
          Thêm GVHD 2
        </button>
      </div>
    </div>
  </div>
