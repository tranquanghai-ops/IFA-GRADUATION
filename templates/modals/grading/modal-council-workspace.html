<!-- ============================================================================
     MODAL: COUNCIL WORKSPACE / ĐIỀU HÀNH & CHẤM ĐIỂM HỘI ĐỒNG (v2.7.4)
     ============================================================================ -->
<div id="modal-council-workspace" class="hidden fixed inset-0 z-[75] modal-backdrop flex items-center justify-center p-1 sm:p-4">
  <style>
    @keyframes cardFlipNext {
      0% {
        transform: perspective(900px) rotateY(0deg) scale(1);
        opacity: 1;
      }
      45% {
        transform: perspective(900px) rotateY(45deg) scale(0.94);
        opacity: 0.35;
      }
      100% {
        transform: perspective(900px) rotateY(0deg) scale(1);
        opacity: 1;
      }
    }
    @keyframes cardFlipPrev {
      0% {
        transform: perspective(900px) rotateY(0deg) scale(1);
        opacity: 1;
      }
      45% {
        transform: perspective(900px) rotateY(-45deg) scale(0.94);
        opacity: 0.35;
      }
      100% {
        transform: perspective(900px) rotateY(0deg) scale(1);
        opacity: 1;
      }
    }
    .card-flip-next {
      animation: cardFlipNext 0.32s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .card-flip-prev {
      animation: cardFlipPrev 0.32s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .touch-pan-y-smooth {
      touch-action: pan-y;
      will-change: transform, opacity;
    }
  </style>

  <div class="bg-white rounded-2xl max-w-6xl xl:max-w-7xl 2xl:max-w-[1680px] w-full h-[98vh] sm:h-[94vh] max-h-[98vh] shadow-2xl flex flex-col overflow-hidden border border-slate-200">
    
    <!-- Ultra-Compact Top Header -->
    <div class="px-2.5 py-2 sm:px-4 sm:py-2.5 border-b border-slate-200 bg-slate-900 text-white shrink-0 shadow-xs">
      <div class="flex items-center justify-between gap-1.5 sm:gap-3">
        <!-- Left: Council Name & Role -->
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 bg-indigo-500/30 text-indigo-300 rounded-lg text-sm flex items-center justify-center font-black shrink-0">🏛️</div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <h3 id="cws-council-name" class="font-black text-xs sm:text-sm text-white tracking-tight truncate">HĐ 1</h3>
              <span id="cws-council-status-badge" class="badge bg-amber-500/20 text-amber-300 border border-amber-500/30 font-bold text-[9px] sm:text-[10px] py-0.5 px-1.5">Chuẩn bị</span>
              <span id="cws-my-role-badge" class="badge bg-indigo-500/30 text-indigo-200 border border-indigo-500/30 font-bold text-[9px] sm:text-[10px] py-0.5 px-1.5">Ủy viên</span>
            </div>
            <div class="text-[10px] text-slate-300 flex items-center gap-x-2 truncate">
              <span id="cws-mobile-member-line" class="font-semibold text-slate-200 truncate"></span>
              <p id="cws-council-meta" class="hidden md:inline text-slate-400">📍 Phòng: D501A • 📅 25/09/2026</p>
            </div>
          </div>
        </div>

        <!-- Center: Fixed Live Countdown Timer Pill in Header -->
        <div id="cws-header-timer-container" class="flex items-center gap-1 shrink-0">
          <div id="cws-header-timer-pill" class="flex items-center gap-1.5 bg-slate-800/95 border border-slate-700/80 px-2 sm:px-2.5 py-1 rounded-xl shadow-xs transition-colors">
            <span class="text-xs">⏱️</span>
            <span id="cws-timer-display" class="font-mono font-black text-sm sm:text-base text-emerald-400 tracking-wider">15:00</span>
            <span id="cws-timer-status" class="hidden sm:inline-block badge bg-slate-700 text-slate-300 text-[9px] font-bold px-1 py-0.5">Sẵn sàng</span>
          </div>

          <!-- Quick Timer Controls for Chair / Secretary / Admin ONLY -->
          <div id="cws-timer-controls" class="hidden items-center gap-1">
            <button type="button" id="cws-timer-toggle-btn" onclick="togglePresentationTimer()" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[11px] font-bold shadow-xs transition-colors cursor-pointer" title="Tạm dừng / Tiếp tục">
              <span id="cws-timer-toggle-text">⏸</span>
            </button>
            <button type="button" onclick="addPresentationTimerMinutes(2)" class="px-1.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 rounded-lg text-[10px] font-bold transition-colors cursor-pointer" title="Cộng 2 phút">+2p</button>
            <button type="button" onclick="resetPresentationTimer()" class="hidden sm:inline-flex px-1.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 rounded-lg text-[10px] font-bold transition-colors cursor-pointer" title="Đặt lại">↺</button>
          </div>
        </div>

        <!-- Right: Actions / Logout / Session Controls -->
        <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
          <!-- Secretary / Admin / Chair Session Controls -->
          <div id="cws-session-controls" class="hidden items-center gap-1">
            <button type="button" id="btn-start-council-session" onclick="startCouncilSession()" class="px-2 sm:px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[11px] font-bold shadow-xs flex items-center gap-1 cursor-pointer">
              <span>▶ Bắt đầu</span>
            </button>
            <button type="button" id="btn-end-council-session" onclick="endCouncilSession()" class="px-2 sm:px-2.5 py-1 bg-rose-700 hover:bg-rose-600 text-white rounded-lg text-[11px] font-bold shadow-xs flex items-center gap-1 cursor-pointer">
              <span>⏹ Kết thúc</span>
            </button>
            <button type="button" id="btn-finalize-council-session" onclick="finalizeCouncilSession()" class="hidden px-2 sm:px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-[11px] font-bold shadow-xs flex items-center gap-1 cursor-pointer">
              <span>🔒 Chốt điểm</span>
            </button>
            <button type="button" id="btn-reopen-council-session" onclick="openReopenCouncilModal()" class="hidden px-2 sm:px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-[11px] font-bold shadow-xs flex items-center gap-1 cursor-pointer">
              <span>🔓 Mở lại</span>
            </button>
          </div>

          <!-- Direct Council Link Mode User Badge & Logout -->
          <div id="cws-direct-user-actions" class="hidden items-center">
            <button type="button" id="btn-cws-direct-logout" onclick="handleCouncilDirectLogout()" class="px-2 py-1 bg-rose-900/60 hover:bg-rose-800 text-rose-200 border border-rose-700/60 rounded-lg text-[11px] font-bold transition-colors flex items-center gap-1 cursor-pointer" title="Đăng xuất khỏi phiên chấm Hội đồng">
              <span>🚪 Đăng xuất</span>
            </button>
          </div>

          <button type="button" id="btn-cws-normal-close" onclick="closeCouncilWorkspace()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg text-[11px] font-bold transition-colors cursor-pointer">✕</button>
        </div>
      </div>
    </div>

    <!-- Mobile / Tablet Tab Switcher (Visible only on screens < md) -->
    <div id="cws-mobile-tab-bar" class="md:hidden flex items-center border-b border-slate-200 bg-slate-100 p-1 gap-1 shrink-0">
      <button type="button" id="btn-cws-tab-students" onclick="switchCouncilWorkspaceMobileTab('students')" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-lg text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1 transition-all cursor-pointer">
        <span>👥</span> <span>Danh sách SV</span> (<span id="cws-mobile-student-count-badge">0</span>)
      </button>
      <button type="button" id="btn-cws-tab-grading" onclick="switchCouncilWorkspaceMobileTab('grading')" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-lg bg-white shadow-xs text-indigo-900 border border-indigo-200 flex items-center justify-center gap-1 transition-all cursor-pointer">
        <span>📝</span> <span>Chấm điểm</span>: <span id="cws-mobile-active-name" class="truncate max-w-[110px] ml-0.5">--</span>
      </button>
    </div>

    <!-- Main Body: 2 Columns Responsive -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden min-h-0">
      
      <!-- LEFT COLUMN: DANH SÁCH SINH VIÊN -->
      <div id="cws-col-students" class="w-full md:w-80 lg:w-96 border-b md:border-b-0 md:border-r border-slate-200 hidden md:flex flex-col bg-slate-50/40 shrink-0 overflow-hidden">
        <div class="p-2.5 sm:p-3 border-b border-slate-200 bg-white space-y-2 shrink-0">
          <div class="flex items-center justify-between text-xs">
            <span class="font-bold text-slate-800 flex items-center gap-1.5">
              <span>👥</span> DANH SÁCH BÁO CÁO (<span id="cws-student-count-badge">0</span>)
            </span>
            <span id="cws-presenting-indicator" class="text-[10px] font-bold text-emerald-600 hidden">● 1 đang trình bày</span>
          </div>
          <input type="text" id="cws-student-search" oninput="filterCouncilWorkspaceStudents(this.value)" placeholder="Tìm MSSV, họ tên, đề tài..." class="w-full p-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        
        <div id="cws-students-list" class="flex-1 overflow-y-auto p-2 space-y-1.5 text-xs">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- RIGHT COLUMN: WORKSPACE FOR SELECTED STUDENT -->
      <div id="cws-col-grading" class="flex-1 flex flex-col overflow-y-auto p-2.5 sm:p-6 space-y-2.5 sm:space-y-4 bg-white min-w-0">
        
        <!-- MOBILE STUDENT STEPPER BAR (< md) - DIRECTLY BELOW HEADER -->
        <div class="flex items-center justify-between p-2 bg-slate-100/90 border border-slate-200 rounded-xl md:hidden text-xs shrink-0">
          <button type="button" onclick="navigateCouncilPrevStudent()" class="px-2.5 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg font-bold text-slate-700 shadow-2xs flex items-center gap-1 cursor-pointer">
            <span>← Trước</span>
          </button>
          <button type="button" onclick="switchCouncilWorkspaceMobileTab('students')" class="font-bold text-indigo-900 bg-indigo-50 border border-indigo-200 px-2 py-1 rounded-lg text-[11px] cursor-pointer">
            <span id="cws-mobile-student-indicator">SV -- / --</span> ▾
          </button>
          <button type="button" onclick="navigateCouncilNextStudent()" class="px-2.5 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg font-bold text-slate-700 shadow-2xs flex items-center gap-1 cursor-pointer">
            <span>Sau →</span>
          </button>
        </div>

        <!-- BANNER: HỘI ĐỒNG HIỆN ĐANG TRÌNH BÀY -->
        <div id="cws-presenting-banner" class="hidden p-2.5 sm:p-3.5 bg-rose-50 border-2 border-rose-300 rounded-2xl flex items-center justify-between shadow-xs">
          <div class="flex items-center gap-2 sm:gap-3 min-w-0">
            <span class="flex h-2.5 w-2.5 relative shrink-0">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
            </span>
            <div class="min-w-0">
              <div class="text-[9px] sm:text-[10px] font-black uppercase text-rose-700 tracking-wider">Hội đồng đang trình bày</div>
              <div id="cws-presenting-banner-text" class="font-black text-slate-900 text-xs sm:text-sm truncate">Trần Văn B (12345678)</div>
            </div>
          </div>
          <button type="button" onclick="goToCurrentPresentingStudent()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-[11px] sm:text-xs rounded-xl shadow-xs transition-colors flex items-center gap-1 shrink-0 cursor-pointer">
            <span>↩ Đang trình bày</span>
          </button>
        </div>

        <!-- SELECTED STUDENT DETAILS CARD WITH 3D FLIP ANIMATION -->
        <div id="cws-selected-student-card" class="p-3.5 sm:p-5 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5 sm:space-y-3 touch-pan-y-smooth">
          <!-- Rendered dynamically -->
        </div>

        <!-- SECRETARY CONTROLS FOR THIS STUDENT -->
        <div id="cws-secretary-actions" class="hidden p-3 bg-indigo-50/60 border border-indigo-200 rounded-xl flex items-center justify-between gap-2">
          <span class="font-bold text-indigo-950 text-xs flex items-center gap-1.5">
            <span>⚡</span> Điều hành báo cáo (Thư ký / Admin):
          </span>
          <div id="cws-secretary-buttons" class="flex items-center gap-2">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- SCORING CARD (LETTER / NUMERIC) -->
        <div id="cws-scoring-section" class="p-4 sm:p-5 bg-white border border-slate-200 rounded-2xl space-y-4 shadow-xs">
          <!-- Rendered dynamically -->
        </div>

        <!-- PROGRESS OF SCORERS IN COUNCIL (PRIVACY PRESERVED) -->
        <div id="cws-scorers-progress-section" class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5">
          <!-- Rendered dynamically -->
        </div>

        <!-- ADMIN REAL-TIME MONITOR (ONLY FOR ADMIN) -->
        <div id="cws-admin-monitor-section" class="hidden p-4 bg-indigo-50/40 border border-indigo-200 rounded-2xl space-y-3">
          <!-- Rendered dynamically -->
        </div>

        <!-- POST-COUNCIL CALIBRATION & GUEST INCLUSION (CHAIR & ADMIN) (v2.0.0-beta.1) -->
        <div id="cws-post-council-section" class="hidden p-4 sm:p-5 bg-amber-50/60 border-2 border-amber-300 rounded-2xl space-y-4">
          <!-- Rendered dynamically -->
        </div>

        <!-- AUDIT LOG HISTORY PANEL (CHAIR & ADMIN) (v2.0.0-beta.1) -->
        <div id="cws-audit-logs-section" class="hidden p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
          <!-- Rendered dynamically -->
        </div>

      </div>

    </div>

  </div>
</div>
