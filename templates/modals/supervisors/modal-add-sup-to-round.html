
  <!-- 3. ADD SUPERVISORS TO ROUND MODAL -->
  <div id="modal-add-sup-to-round" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between p-5 border-b border-slate-100 shrink-0">
        <div>
          <h3 class="font-bold text-base text-tdtu-blue">Thêm Giảng viên vào Đợt Tốt nghiệp</h3>
          <p class="text-xs text-slate-500 mt-0.5">Chọn giảng viên từ Danh sách GVHD để tham gia hướng dẫn trong đợt này</p>
        </div>
        <button onclick="closeAddSupToRoundModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
      </div>

      <div class="p-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between text-xs">
        <span class="text-slate-600">Đã chọn: <strong id="sup-master-picker-selected-count" class="text-blue-600 font-black">0</strong> giảng viên</span>
        <button type="button" onclick="toggleSelectAllSupPicker()" class="text-blue-600 hover:underline font-bold">Chọn tất cả</button>
      </div>

      <div id="sup-master-picker-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2">
      </div>

      <div class="flex justify-between items-center p-4 bg-white border-t border-slate-100 shrink-0 sticky bottom-0">
        <span id="sup-picker-total-badge" class="text-[11px] text-slate-400 font-medium">0 GVHD khả dụng</span>
        <div class="flex gap-2">
          <button type="button" onclick="closeAddSupToRoundModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-xs text-slate-600 hover:bg-slate-200 transition-colors">Hủy</button>
          <button type="button" onclick="saveSelectedSupervisorsToRound()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow-md transition-colors">Thêm vào Đợt</button>
        </div>
      </div>
    </div>
  </div>
