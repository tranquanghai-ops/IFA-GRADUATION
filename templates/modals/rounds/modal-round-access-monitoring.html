<!-- === MODAL: ROUND ACCESS & LOGIN MONITORING DASHBOARD === -->
<div id="modal-round-access-monitoring" class="hidden fixed inset-0 z-[70] modal-backdrop flex items-center justify-center p-2 sm:p-4" onclick="if(event.target === this) closeRoundAccessMonitoringModal()">
  <div class="bg-white rounded-2xl w-full max-w-5xl h-[92vh] shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
    <!-- Header -->
    <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between gap-3 shrink-0">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl">👁️</span>
          <h3 class="font-black text-base text-white">Giám sát Đăng nhập & Hoạt động</h3>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-400 text-slate-950 uppercase">Audit & Access</span>
        </div>
        <p id="monitoring-modal-round-title" class="text-xs text-slate-300 mt-0.5 truncate">Đang tải tên đợt...</p>
      </div>
      <button type="button" onclick="closeRoundAccessMonitoringModal()" class="w-8 h-8 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold text-base transition flex items-center justify-center" aria-label="Đóng">✕</button>
    </div>

    <!-- Summary Metrics Grid -->
    <div class="p-4 bg-slate-50 border-b border-slate-200 grid grid-cols-1 sm:grid-cols-3 gap-3 shrink-0">
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-2xs">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-600">🎓 Sinh viên đợt</span>
          <span class="text-[10px] text-slate-400 font-semibold">Đã vào / Tổng</span>
        </div>
        <div id="mon-stat-sv" class="text-sm font-black text-slate-900 mt-1">--</div>
      </div>

      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-2xs">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-600">👨‍🏫 Giảng viên HD</span>
          <span class="text-[10px] text-slate-400 font-semibold">Đã vào / Tổng</span>
        </div>
        <div id="mon-stat-gv" class="text-sm font-black text-slate-900 mt-1">--</div>
      </div>

      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-2xs">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-600">🏛️ Thành viên Hội đồng</span>
          <span class="text-[10px] text-slate-400 font-semibold">Đã vào / Tổng</span>
        </div>
        <div id="mon-stat-hd" class="text-sm font-black text-slate-900 mt-1">--</div>
      </div>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="p-4 bg-white border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shrink-0">
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="flex items-center gap-1.5">
          <label for="mon-filter-role" class="text-xs font-bold text-slate-700">Vai trò:</label>
          <select id="mon-filter-role" onchange="filterRoundAccessMonitoringTable()" class="p-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:outline-none">
            <option value="all">Tất cả vai trò</option>
            <option value="student">🎓 Sinh viên</option>
            <option value="supervisor">👨‍🏫 GVHD</option>
            <option value="council">🏛️ Hội đồng</option>
          </select>
        </div>

        <div class="flex items-center gap-1.5">
          <label for="mon-filter-status" class="text-xs font-bold text-slate-700">Trạng thái:</label>
          <select id="mon-filter-status" onchange="filterRoundAccessMonitoringTable()" class="p-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold focus:outline-none">
            <option value="all">Tất cả trạng thái</option>
            <option value="never_logged_in">🚨 Chưa từng đăng nhập</option>
            <option value="logged_in">🟢 Đã đăng nhập</option>
          </select>
        </div>

        <div class="relative min-w-[200px]">
          <input type="text" id="mon-search-input" oninput="filterRoundAccessMonitoringTable()" placeholder="Tìm theo tên, MSSV, email, thao tác..." class="w-full pl-7 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:bg-white focus:outline-none">
          <span class="absolute left-2.5 top-2 text-slate-400 text-xs">🔍</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="mon-filtered-count" class="text-xs font-bold text-slate-500">0 tài khoản</span>
        <button type="button" onclick="exportRoundAccessMonitoringCSV()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-2xs cursor-pointer">
          <span>📊 Xuất Excel/CSV</span>
        </button>
      </div>
    </div>

    <!-- Table Body -->
    <div class="flex-1 overflow-y-auto p-4">
      <div class="border border-slate-200 rounded-xl overflow-hidden shadow-2xs">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-700 font-bold uppercase border-b border-slate-200">
            <tr>
              <th class="p-3 text-center w-12">STT</th>
              <th class="p-3 w-28">Vai trò</th>
              <th class="p-3">Họ và tên & Thông tin</th>
              <th class="p-3">Email liên hệ</th>
              <th class="p-3">Lần đăng nhập cuối</th>
              <th class="p-3">Thao tác cuối cùng</th>
            </tr>
          </thead>
          <tbody id="monitoring-table-tbody" class="divide-y divide-slate-100 bg-white">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
