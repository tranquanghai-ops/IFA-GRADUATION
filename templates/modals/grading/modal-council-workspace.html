<!-- ============================================================================
     MODAL: COUNCIL WORKSPACE / ĐIỀU HÀNH & CHẤM ĐIỂM HỘI ĐỒNG (v2.7.4)
     ============================================================================ -->
<div id="modal-council-workspace" class="hidden fixed inset-0 z-[75] modal-backdrop flex items-center justify-center p-1 sm:p-4">
  <div class="bg-white rounded-2xl max-w-6xl xl:max-w-7xl 2xl:max-w-[1680px] w-full h-[98vh] sm:h-[94vh] max-h-[98vh] shadow-2xl flex flex-col overflow-hidden border border-slate-200">
    
    <!-- Ultra-Compact Top Header -->
    <div class="px-2.5 py-2 sm:px-4 sm:py-2.5 border-b border-slate-200 bg-slate-900 text-white shrink-0 shadow-xs">
      <div class="cws-header-layout flex items-center justify-between gap-1.5 sm:gap-3">
        <!-- Left: Council Name & Role -->
        <div class="cws-header-identity flex items-center gap-2 min-w-0">
          <div class="min-w-0">
            <div class="cws-identity-line flex items-center gap-1.5 flex-wrap">
              <span id="cws-my-role-badge" class="font-bold">Ủy viên</span>
              <span id="cws-council-name" class="font-bold">1</span>
              <span aria-hidden="true">–</span>
              <div class="cws-member-menu-anchor">
                <button type="button" id="cws-member-menu-trigger" onclick="toggleCouncilMemberMenu()" aria-expanded="false" aria-controls="cws-member-menu" class="cws-member-menu-trigger font-black text-xs sm:text-sm text-white tracking-tight" title="Xem thông tin tài khoản và đăng xuất"><span id="cws-member-heading">Thành viên hội đồng</span><span aria-hidden="true">⌄</span></button>
                <div id="cws-member-menu" class="cws-member-menu hidden" aria-label="Thông tin thành viên hội đồng">
                  <p class="cws-member-menu-heading">Tài khoản hội đồng</p>
                  <p id="cws-member-menu-name" class="cws-member-menu-name"></p>
                  <p id="cws-member-menu-role" class="cws-member-menu-detail"></p>
                  <p id="cws-member-menu-email" class="cws-member-menu-detail"></p>
                  <button type="button" onclick="handleCouncilDirectLogout()" class="cws-member-menu-logout">Đăng xuất</button>
                </div>
              </div>
              <div class="cws-status-anchor"><button type="button" id="cws-council-status-badge" class="cws-status-dot" onclick="toggleCouncilStatusDetails()" aria-label="Xem trạng thái hội đồng" aria-expanded="false" aria-controls="cws-status-details"></button><div id="cws-status-details" class="cws-status-details hidden" role="status">Hội đồng đang chuẩn bị.</div></div>
            </div>
            <span id="cws-mobile-member-line" class="hidden"></span>
            <p id="cws-council-meta" class="hidden"></p>
          </div>
        </div>

        <!-- Center: Fixed Live Countdown Timer Pill in Header -->
        <div id="cws-header-timer-container" class="relative flex items-center gap-1 shrink-0">
          <button type="button" id="cws-header-timer-pill" onclick="toggleCouncilTimerSettings()" aria-label="Cài đặt đồng hồ" aria-expanded="false" aria-controls="cws-timer-settings" class="flex items-center gap-1.5 bg-rose-950/70 border border-rose-600/70 px-2 sm:px-2.5 py-1 rounded-xl shadow-xs transition-colors">
            <span id="cws-timer-readonly-icon" class="text-xs">⏱️</span>
            <span id="cws-timer-display" class="font-mono font-black text-sm sm:text-base text-rose-300 tracking-wider">15:00</span>
            <span id="cws-timer-status" class="hidden sm:inline-block badge bg-slate-700 text-slate-300 text-[9px] font-bold px-1 py-0.5">Sẵn sàng</span>
          </button>

          <!-- Quick Timer Controls for Chair / Secretary / Admin ONLY -->
          <div id="cws-timer-controls" class="hidden items-center gap-1">
            <button type="button" id="cws-timer-short-add-btn" onclick="addCouncilTimerQuickTime('short')" class="px-1.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 rounded-lg text-[10px] font-bold transition-colors cursor-pointer" title="Cộng thêm 30 giây">+30s</button>
            <button type="button" id="cws-timer-long-add-btn" onclick="addCouncilTimerQuickTime('long')" class="px-1.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 rounded-lg text-[10px] font-bold transition-colors cursor-pointer" title="Cộng thêm 1 phút">+1p</button>
            <button type="button" id="cws-timer-toggle-btn" onclick="togglePresentationTimer()" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[11px] font-bold shadow-xs transition-colors cursor-pointer" title="Bắt đầu / Tạm dừng"><span id="cws-timer-toggle-text">Bắt đầu</span></button>
            <button type="button" onclick="resetPresentationTimer()" class="hidden sm:inline-flex px-1.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white border border-slate-700 rounded-lg text-[10px] font-bold transition-colors cursor-pointer" title="Đặt lại">↺</button>
          </div>
          <div id="cws-timer-settings" class="hidden cws-timer-settings" role="group" aria-label="Cài đặt đồng hồ trình bày">
            <div class="flex items-center justify-between gap-2 mb-3"><strong class="text-sm text-slate-900">Cài đặt đồng hồ</strong><button type="button" onclick="toggleCouncilTimerSettings(false)" class="text-slate-500 hover:text-slate-900" aria-label="Đóng cài đặt đồng hồ">✕</button></div>
            <label class="cws-timer-setting-label" for="cws-timer-duration-input">Thời gian trình bày (phút)</label>
            <input id="cws-timer-duration-input" type="number" min="1" max="180" step="1" class="cws-timer-setting-input" value="15">
            <label class="cws-timer-setting-label" for="cws-timer-short-add-input">Nút cộng nhanh 1 (giây)</label>
            <input id="cws-timer-short-add-input" type="number" min="5" max="300" step="5" class="cws-timer-setting-input" value="30">
            <label class="cws-timer-setting-label" for="cws-timer-long-add-input">Nút cộng nhanh 2 (phút)</label>
            <input id="cws-timer-long-add-input" type="number" min="1" max="30" step="1" class="cws-timer-setting-input" value="1">
            <label class="cws-timer-setting-label" for="cws-timer-sound-select">Âm báo hết giờ</label>
            <select id="cws-timer-sound-select" class="cws-timer-setting-input">
              <option value="1">1 · Chuông nhịp đôi</option><option value="2">2 · Chuông ba nhịp</option><option value="3">3 · Âm thăng</option><option value="4">4 · Âm trầm</option><option value="5">5 · Nhịp nhanh</option><option value="6">6 · Nhịp chậm</option><option value="7">7 · Nhịp bậc thang</option><option value="8">8 · Nhịp luân phiên</option><option value="9">9 · Chuông dài</option><option value="10">10 · Báo khẩn</option>
            </select>
            <div class="flex flex-wrap gap-2 mt-3"><button type="button" onclick="saveCouncilTimerSettings()" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold">Lưu cài đặt</button><button type="button" onclick="previewCouncilTimerSound()" class="px-3 py-2 rounded-lg border border-slate-300 text-slate-700 text-xs font-bold">Nghe thử</button><button type="button" onclick="stopCouncilTimerAlarm()" class="px-3 py-2 rounded-lg border border-rose-200 text-rose-700 text-xs font-bold">Tắt âm</button></div>
          </div>
        </div>

        <!-- Right: Actions / Logout / Session Controls -->
        <div class="cws-header-actions flex items-center gap-1 sm:gap-1.5 shrink-0">
          <!-- Secretary / Admin / Chair Session Controls -->
          <div id="cws-session-controls" class="hidden items-center gap-1">
            <button type="button" id="btn-start-council-session" onclick="startCouncilSession()" class="px-2 sm:px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[11px] font-bold shadow-xs flex items-center gap-1 cursor-pointer">
              <span>▶ Bắt đầu</span>
            </button>
            <button type="button" id="btn-finalize-council-session" onclick="finalizeCouncilSession()" class="hidden px-2 sm:px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-[11px] font-bold shadow-xs flex items-center gap-1 cursor-pointer">
              <span>🔒 Chốt điểm</span>
            </button>
            <button type="button" id="btn-reopen-council-session" onclick="openReopenCouncilModal()" class="hidden px-2 sm:px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-[11px] font-bold shadow-xs flex items-center gap-1 cursor-pointer">
              <span>🔓 Mở lại</span>
            </button>
          </div>

          <button type="button" id="btn-cws-normal-close" onclick="closeCouncilWorkspace()" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg text-[11px] font-bold transition-colors cursor-pointer">✕</button>
        </div>
      </div>
    </div>

    <!-- Mobile / Tablet Tab Switcher (Visible only on screens < md) -->
    <div id="cws-mobile-tab-bar" class="md:hidden flex items-center border-b border-slate-200 bg-slate-100 p-1 gap-1 shrink-0">
      <button type="button" id="btn-cws-tab-students" onclick="switchCouncilWorkspaceMobileTab('students')" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-lg text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1 transition-all cursor-pointer">
        <span>👥</span> <span>Danh sách SV</span> (<span id="cws-mobile-student-count-badge">0</span>)
      </button>
      <button type="button" id="btn-cws-tab-grading" onclick="switchCouncilWorkspaceMobileTab('grading')" class="flex-1 py-1.5 px-2 text-xs font-bold rounded-lg bg-white shadow-xs text-indigo-900 border border-indigo-200 flex items-center justify-center gap-1 transition-all cursor-pointer">
        <span>📝</span> <span>Chấm điểm</span><span class="cws-mobile-active-label">: <span id="cws-mobile-active-name" class="truncate max-w-[110px] ml-0.5">--</span></span>
      </button>
    </div>

    <!-- Main Body: 2 Columns Responsive -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden min-h-0">
      
      <!-- LEFT COLUMN: DANH SÁCH SINH VIÊN -->
      <div id="cws-col-students" class="w-full md:w-80 lg:w-96 border-b md:border-b-0 md:border-r border-slate-200 hidden md:flex flex-col bg-slate-50/40 shrink-0 overflow-hidden">
        <div class="p-2.5 sm:p-3 border-b border-slate-200 bg-white space-y-2 shrink-0">
          <span id="cws-presenting-indicator" class="text-[10px] font-bold text-emerald-600 hidden">● 1 đang trình bày</span>
          <input type="text" id="cws-student-search" oninput="filterCouncilWorkspaceStudents(this.value)" placeholder="Tìm MSSV, họ tên, đề tài..." class="w-full p-2 border border-slate-200 rounded-xl text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        
        <div id="cws-students-list" class="flex-1 overflow-y-auto p-2 space-y-1.5 text-xs">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- RIGHT COLUMN: WORKSPACE FOR SELECTED STUDENT -->
      <div id="cws-col-grading" class="flex-1 flex flex-col overflow-y-auto p-2.5 sm:p-6 space-y-2.5 sm:space-y-4 bg-white min-w-0">
        
        <!-- MOBILE STUDENT STEPPER BAR (< md) - DIRECTLY BELOW HEADER -->
        <div class="flex items-center justify-between p-2 bg-slate-100/90 border border-slate-200 rounded-xl md:hidden text-xs shrink-0">
          <button type="button" onclick="navigateCouncilPrevStudent()" class="px-2.5 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg font-bold text-slate-700 shadow-2xs flex items-center gap-1 cursor-pointer">
            <span>← Trước</span>
          </button>
          <button type="button" onclick="switchCouncilWorkspaceMobileTab('students')" class="font-bold text-indigo-900 bg-indigo-50 border border-indigo-200 px-2 py-1 rounded-lg text-[11px] cursor-pointer">
            <span id="cws-mobile-student-indicator">SV -- / --</span> ▾
          </button>
          <button type="button" onclick="navigateCouncilNextStudent()" class="px-2.5 py-1.5 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg font-bold text-slate-700 shadow-2xs flex items-center gap-1 cursor-pointer">
            <span>Sau →</span>
          </button>
        </div>

        <!-- BANNER: HỘI ĐỒNG HIỆN ĐANG TRÌNH BÀY -->
        <div id="cws-presenting-banner" class="hidden p-2.5 sm:p-3.5 bg-rose-50 border-2 border-rose-300 rounded-2xl flex items-center justify-between shadow-xs">
          <div class="flex items-center gap-2 sm:gap-3 min-w-0">
            <span class="flex h-2.5 w-2.5 relative shrink-0">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
            </span>
            <div class="min-w-0">
              <div class="text-[9px] sm:text-[10px] font-black uppercase text-rose-700 tracking-wider">Hội đồng đang trình bày</div>
              <div id="cws-presenting-banner-text" class="font-black text-slate-900 text-xs sm:text-sm truncate">Trần Văn B (12345678)</div>
            </div>
          </div>
          <button type="button" onclick="goToCurrentPresentingStudent()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-[11px] sm:text-xs rounded-xl shadow-xs transition-colors flex items-center gap-1 shrink-0 cursor-pointer">
            <span>↩ Đang trình bày</span>
          </button>
        </div>

        <div id="cws-secretary-actions" class="hidden p-3 bg-indigo-50/60 border border-indigo-200 rounded-xl flex flex-wrap items-center justify-center gap-2">
          <span class="font-bold text-indigo-950 text-xs flex items-center gap-1.5"><span>⚡</span> Điều hành trình bày</span>
          <label class="text-xs font-semibold text-indigo-950" for="cws-presentation-student-select">Chọn SV:
            <select id="cws-presentation-student-select" onchange="selectCouncilStudent(this.value, true)" class="ml-1 max-w-[230px] rounded-lg border border-indigo-200 bg-white px-2 py-1.5 text-xs text-slate-900"></select>
          </label>
          <div id="cws-secretary-buttons" class="flex flex-wrap items-center justify-center gap-2 w-full"></div>
        </div>

        <!-- ONE STUDENT CARD: DETAILS AND PERSONAL SCORE SHEET MOVE TOGETHER -->
        <div id="cws-student-score-card" class="cws-student-score-card bg-white border border-slate-200 rounded-2xl shadow-xs touch-pan-y-smooth">
          <div id="cws-selected-student-card" class="p-3.5 sm:p-5 bg-slate-50/70 rounded-t-2xl space-y-2.5 sm:space-y-3">
            <!-- Rendered dynamically -->
          </div>
          <div id="cws-scoring-section" class="p-3.5 sm:p-5 border-t border-slate-200 space-y-4">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- PROGRESS OF SCORERS IN COUNCIL (PRIVACY PRESERVED) -->
        <div id="cws-scorers-progress-section" class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5">
          <!-- Rendered dynamically -->
        </div>

        <!-- ADMIN REAL-TIME MONITOR (ONLY FOR ADMIN) -->
        <div id="cws-admin-monitor-section" class="hidden p-4 bg-indigo-50/40 border border-indigo-200 rounded-2xl space-y-3">
          <!-- Rendered dynamically -->
        </div>

        <!-- POST-COUNCIL CALIBRATION & GUEST INCLUSION (CHAIR & ADMIN) (v2.0.0-beta.1) -->
        <div id="cws-post-council-section" class="hidden p-4 sm:p-5 bg-amber-50/60 border-2 border-amber-300 rounded-2xl space-y-4">
          <!-- Rendered dynamically -->
        </div>

        <!-- AUDIT LOG HISTORY PANEL (CHAIR & ADMIN) (v2.0.0-beta.1) -->
        <div id="cws-audit-logs-section" class="hidden p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
          <!-- Rendered dynamically -->
        </div>
        <div id="cws-end-session-footer" class="hidden mt-3 pt-4 border-t border-slate-200 text-center">
          <button type="button" id="btn-end-council-session" onclick="endCouncilSession()" class="px-4 py-2.5 bg-rose-700 hover:bg-rose-600 text-white rounded-xl text-sm font-bold shadow-xs cursor-pointer">⏹ Kết thúc hội đồng</button>
        </div>

      </div>

    </div>

  </div>
</div>
