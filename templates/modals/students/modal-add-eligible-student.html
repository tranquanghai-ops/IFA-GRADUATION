
  <!-- MODAL: TÌM VÀ THÊM SINH VIÊN VÀO ĐỢT (TỪ FACULTY STUDENT MASTER) -->
  <div id="modal-add-eligible-student" class="hidden fixed inset-0 z-[60] modal-backdrop flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full shadow-2xl flex flex-col max-h-[90vh] overflow-hidden border border-slate-200">
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-5 border-b border-slate-100 shrink-0 bg-slate-50/50">
        <div>
          <h3 class="font-bold text-base text-tdtu-blue flex items-center gap-2">
            <span>Thêm sinh viên vào đợt tốt nghiệp</span>
          </h3>
          <p class="text-xs text-slate-500 mt-0.5">Tìm kiếm từ Danh sách Sinh viên Khoa (Faculty Student Master)</p>
        </div>
        <button type="button" onclick="closeAddEligibleStudentModal()" class="text-slate-400 hover:text-slate-600 font-bold p-1 text-lg rounded-lg hover:bg-slate-100 transition-colors">✕</button>
      </div>

      <!-- Modal Search & Filters -->
      <div class="p-4 border-b border-slate-100 bg-white shrink-0 space-y-3">
        <div class="relative w-full">
          <input type="text" id="add-eligible-student-search-input" oninput="onAddEligibleStudentSearchInput(this.value)" placeholder="🔍 Tìm theo MSSV, Họ và tên, Lớp (hỗ trợ có dấu / không dấu)..." class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" autocomplete="off">
          <span class="absolute left-3 top-3 text-slate-400 text-xs">🔍</span>
          <button type="button" onclick="clearAddEligibleSearch()" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 font-bold text-xs" id="add-eligible-clear-btn">✕</button>
        </div>
        <div class="flex items-center justify-between text-xs text-slate-600 px-1">
          <span id="add-eligible-search-count">Đang tải danh sách sinh viên...</span>
          <span id="add-eligible-selected-count" class="font-bold text-emerald-700">Đã chọn: 0 SV</span>
        </div>
      </div>

      <!-- Modal Candidates Table -->
      <div class="flex-1 overflow-y-auto overflow-x-auto min-h-[250px] p-0">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200 sticky top-0 z-10 text-[11px] uppercase">
            <tr>
              <th class="p-2.5 w-10 text-center">
                <input type="checkbox" id="select-all-eligible-candidates" onchange="toggleSelectAllEligibleCandidates(this.checked)" class="rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer">
              </th>
              <th class="p-2.5 w-28">MSSV</th>
              <th class="p-2.5">Họ và tên</th>
              <th class="p-2.5 w-32">Ngành</th>
              <th class="p-2.5 w-28">Lớp</th>
              <th class="p-2.5 text-center w-28">Trạng thái</th>
            </tr>
          </thead>
          <tbody id="add-eligible-students-tbody" class="divide-y divide-slate-100">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-between px-6 py-4 bg-slate-50 border-t border-slate-100 shrink-0">
        <span class="text-[11px] text-slate-500">💡 Có thể chọn nhiều sinh viên cùng lúc để thêm vào đợt</span>
        <div class="flex gap-2">
          <button type="button" onclick="closeAddEligibleStudentModal()" class="px-4 py-2 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-100 transition-colors text-xs">Hủy</button>
          <button type="button" id="btn-confirm-add-eligible-students" onclick="addSelectedEligibleCandidatesToRound()" disabled class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl font-bold shadow-md transition-colors text-xs">Thêm 0 sinh viên đã chọn</button>
        </div>
      </div>
    </div>
  </div>
